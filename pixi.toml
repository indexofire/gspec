[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "gspec"
platforms = ["linux-64"]
version = "0.10.1"

[tasks]
lint = "ruff check"
fmt = "ruff format"
fmt-check = "ruff format --check"
typecheck = "basedpyright"
test = "pytest"
gspec = "gspec"

[dependencies]
blast = ">=2.15"
minimap2 = ">=2.24"
pyrodigal = ">=3.7.1,<4"

# CI baseline (AGENTS.md §2): Python 3.12 only, matching gside/gmlst and gseek.
[feature.py312.dependencies]
python = "3.12.*"


[pypi-dependencies]
gspec = { path = ".", editable = true }
ruff = ">=0.6"
basedpyright = ">=1.19"
pytest = ">=8"
build = ">=1.6.1, <2"
twine = ">=7.0.0, <8"
# Wheel metadata is 2.5 (PEP 639 License-Expression/License-File via
# hatchling>=1.27); only packaging>=25 parses it, and twine 6.x rejects it with
# "InvalidDistribution: '2.5' is not a valid metadata version".
packaging = ">=25"

# abricate's bioconda perl stack (zlib 1.2) cannot co-solve with the python>=3.13
# stack (libzlib>=1.3), so the parity env is abricate-only; the harness runs on
# the default env's python and merges both envs' PATHs.
[feature.parity.dependencies]
abricate = "*"

[feature.parity.tasks]
parity = ".pixi/envs/default/bin/python tests/parity/run_parity.py"
summary-parity = ".pixi/envs/default/bin/python tests/parity/run_summary_parity.py"

# Docs site (MkDocs Material). Dev-only: never in gspec's runtime deps or the
# gates environments (AGENTS.md §2 dependency discipline).
[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"
mkdocs-static-i18n = ">=1.2"

# Optional alignment engine for every supported Python (3.12).
[feature.gseek.pypi-dependencies]
# in-silico PCR (`gspec db build -C` pcr stages) ships in gseek's unreleased
# ispcr work, so the dev environment tracks that commit: PyPI's newest release
# is 0.10.4, which has no `gseek.read_primers`. Swap this back to a version
# range (`">=0.11"`) as soon as the release is published — the runtime gate in
# composite_ops is a capability probe, so the published extra in pyproject.toml
# stays on the released floor.
gseek = { git = "https://github.com/indexofire/gseek", rev = "67940dbf0836200eae2b322b5cfadd4f591056db" }

[environments]
default = ["py312", "gseek"]
parity = { features = ["parity"], no-default-feature = true }
# Python lives in py312, not the default feature; docs needs a conda python.
docs = { features = ["py312", "docs"] }
